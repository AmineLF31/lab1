name: CI en plusieurs Jobs 

on:
  push:
    
jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest    

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Mettre en cache les dépendances
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Installer les dépendances
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test    
    
  Build:
    name: Build
    runs-on: ubuntu-latest    
    needs: Test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Mettre en cache les dépendances
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}

      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name : Find generated js file
        id: find-js-file
        run: echo "script-file = " && find dist -name "*.js" >> $GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist

  Deploy:
    name: Deploy
    runs-on: ubuntu-latest    
    needs: Build
    steps:
      - name: Récupérer les artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Vérifier le contenu des artifacts
        run: ls -R

      - name: Deploy
        run: 'echo "Deploying ... fichier principal : ${{needs.Build.outputs.find-js-file.script-file}}"'

      
      