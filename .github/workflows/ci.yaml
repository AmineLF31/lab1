name: CI en plusieurs Jobs 

on:
  push:
    
jobs:
  Test:
    name: Test
    runs-on: ubuntu-latest    

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test    
    
  Build:
    name: Build
    runs-on: ubuntu-latest    
    needs: Test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        
      - name: Installer les dépendances
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist

  Deploy:
    name: Deploy
    runs-on: ubuntu-latest    
    needs: Build
    steps:
      - name: Récupérer les artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: Vérifier le contenu des artifacts
        run: ls -R

      - name: Deploy
        run : echo "Deploying the application................................"

      
      