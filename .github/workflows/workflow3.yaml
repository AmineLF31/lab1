name: Issue Workflow  

on:
  issues:
    
jobs:
  issue_job:
    name: Issue Job
    runs-on: ubuntu-latest    

    steps:
      - name: github context
        env:
            GITHUB_CONTEXT : ${{toJSON(github)}}
        run : echo "github context $GITHUB_CONTEXT"
      - name: github event context
        env:
            EVENT_CONTEXT : ${{toJSON(github.event)}}
        run : echo "github context $EVENT_CONTEXT"